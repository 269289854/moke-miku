# Replace the slow MSVC link.exe with LLVM's lld-link (ships with Rust).
# This is the single biggest win for Windows compile+link times.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Dev profile: keep line-table diagnostics without the multi-gigabyte
# incremental cache produced by Moke + Readest's large dependency graph.
[profile.dev]
codegen-units = 16
incremental = false
opt-level = 0
debug = 1
